name: pulumi-nebius provider

on:
  # Re-generate SDK whenever the upstream Terraform provider releases a new version
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC

  # Manual trigger — used for one-off bumps: Actions → Run workflow → VERSION=x.y.z
  workflow_dispatch:
    inputs:
      version:
        description: "Nebius Terraform provider version (e.g. 0.6.36)"
        required: false
        default: ""

  # Re-run on changes to the provider directory itself
  push:
    paths:
      - "providers/pulumi-nebius/**"
    branches: [main]

jobs:
  # ── Check latest upstream version ─────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -s https://registry.terraform.io/v1/providers/nebius/nebius \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
            echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with checked-in version
        id: compare
        run: |
          CURRENT=$(grep '^PROVIDER_VERSION' providers/pulumi-nebius/Makefile \
            | head -1 | awk -F'= ' '{print $2}')
          TARGET="${{ steps.resolve.outputs.version }}"
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

  # ── Regenerate SDK ────────────────────────────────────────────────────────
  generate-sdk:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          pulumi-version: latest

      - name: Install pulumi-terraform-provider plugin
        run: pulumi plugin install resource terraform-provider

      - name: Bump version pin in Makefile
        working-directory: providers/pulumi-nebius
        run: make bump VERSION="${{ needs.check-version.outputs.version }}"

      - name: Regenerate Python SDK
        working-directory: providers/pulumi-nebius
        run: make sdk VERSION="${{ needs.check-version.outputs.version }}"

      - name: Validate SDK imports
        working-directory: providers/pulumi-nebius
        run: |
          pip install pulumi -e sdk
          python -c "
          import pulumi_nebius as n
          print('Provider:  ', n.Provider)
          print('Cluster:   ', n.Mk8sV1Cluster)
          print('NodeGroup: ', n.Mk8sV1NodeGroup)
          print('Subnet:    ', n.VpcV1Subnet)
          print('OK')
          "

      - name: Open PR with updated SDK
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "chore/pulumi-nebius-${{ needs.check-version.outputs.version }}"
          title: "chore(provider): bump pulumi-nebius to ${{ needs.check-version.outputs.version }}"
          body: |
            ## Automated SDK update

            Bumps the Nebius Terraform provider from the current version to
            `${{ needs.check-version.outputs.version }}` and regenerates the
            Pulumi Python SDK via `pulumi package add terraform-provider`.

            No Go compilation required — the SDK is generated directly from
            the published Terraform provider binary.

            ### Files changed
            - `providers/pulumi-nebius/Makefile` — version pin updated
            - `providers/pulumi-nebius/sdk/` — regenerated Python SDK

            ### How to test
            ```bash
            pip install -e providers/pulumi-nebius/sdk
            cd clusters/nebius-prod/infra && pulumi preview
            ```
          commit-message: "chore(provider): bump pulumi-nebius to ${{ needs.check-version.outputs.version }}"
          labels: provider-update, automated

  # ── Validate on every PR that touches the provider ───────────────────────
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK and validate imports
        working-directory: providers/pulumi-nebius
        run: |
          pip install pulumi -e sdk
          python -c "
          import pulumi_nebius as n
          print('Provider:  ', n.Provider)
          print('Cluster:   ', n.Mk8sV1Cluster)
          print('NodeGroup: ', n.Mk8sV1NodeGroup)
          print('Subnet:    ', n.VpcV1Subnet)
          print('OK')
          "
