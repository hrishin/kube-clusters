# Nebius MK8s cluster configuration.
cluster_name: nebius-alpha
project_id: "project-e00s6kp7pr00pxcs1xc9m4"
kubernetes_version: "1.34"

node_groups:
  default:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  core:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  mimir:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 3
    preemptible: false
    labels:
      node-type: mimir
      workload: monitoring
      environment: production
    taints:
      - key: node-type
        value: mimir
        effect: NoSchedule


  gpu-inference:
    platform: gpu-l40s-d
    preset: 1gpu-32vcpu-192gb
    desired_size: 1
    min_size: 1
    max_size: 4
    preemptible: true
    labels:
      node-type: gpu
      workload: inference
      environment: production
      accelerator: nvidia-l40s
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule

  # Multi-node NVLink serving (H100 SXM, NVLink4 fabric)
  # Four nodes joined by an NvlInstanceGroup — 32 H100s accessible as one NVLink domain.
  # Sized for Kimi K3 (MXFP4, ~1.6TB weights): 3 nodes fit the weights but leave
  # too little KV headroom, 4 nodes is the practical minimum (see
  # docs/multi-node-inference-options.md).
#   gpu-nvlink:
#     platform: gpu-h100-sxm
#     preset: 8gpu-128vcpu-1600gb        # 8 × H100 80 GB SXM per node
#     desired_size: 4
#     min_size: 4
#     max_size: 4
#     preemptible: false
#     nvlink_group: nvlink-h100   # references nvlink_groups entry below
#     labels:
#       node-type: gpu-nvlink
#       workload: inference-nvlink
#       environment: production
#       accelerator: nvidia-h100-sxm
#     taints:
#       - key: nvidia.com/gpu
#         value: "true"
#         effect: NoSchedule
#       - key: workload
#         value: inference-nvlink
#         effect: NoSchedule

# # NVLink instance groups — Nebius provisions the NVLink Switch fabric
# # before nodes join the cluster. type is the NvlInstanceGroup type:
# #   GB200 = NVIDIA GB200 NVLink rack (Blackwell), GB300 = GB300 rack.
# nvlink_groups:
#   nvlink-h100:
#     type: GB200
#     size: 4
