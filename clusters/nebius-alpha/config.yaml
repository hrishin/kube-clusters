# Nebius MK8s cluster configuration.
cluster_name: nebius-alpha
project_id: "project-e00s6kp7pr00pxcs1xc9m4"
kubernetes_version: "1.34"

node_groups:
  default:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  core:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  mimir:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 3
    preemptible: false
    labels:
      node-type: mimir
      workload: monitoring
      environment: production
    taints:
      - key: node-type
        value: mimir
        effect: NoSchedule


  gpu-inference:
    platform: gpu-l40s-d
    preset: 1gpu-32vcpu-192gb
    desired_size: 1
    min_size: 1
    max_size: 4
    preemptible: true
    labels:
      node-type: gpu
      workload: inference
      environment: production
      accelerator: nvidia-l40s
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule

  # Multi-node H100 SXM serving, clustered via InfiniBand (NOT cross-node NVLink —
  # NVLink Switch fabric across servers only exists for GB200/GB300 platforms.
  # H100 SXM NVLink is intra-node only, 8 GPUs/server; cross-node communication
  # (TP/EP across the 4 nodes below) goes over InfiniBand via the GPU cluster
  # referenced below).
  # Sized for Kimi K3 (MXFP4, ~1.6TB weights): 3 nodes fit the weights but leave
  # too little KV headroom, 4 nodes is the practical minimum (see
  # docs/multi-node-inference-options.md — NOTE: that doc's bandwidth claims for
  # this node group need revisiting now that the interconnect is confirmed to
  # be InfiniBand, not NVLink Switch).
  # node-type/workload label values below still say "nvlink" for historical
  # reasons (matches existing nodeSelectors/tolerations/taints across the repo);
  # not renamed to avoid a wide, purely-cosmetic rename across many files.
  gpu-nvlink:
    platform: gpu-h100-sxm
    preset: 8gpu-128vcpu-1600gb        # 8 × H100 80 GB SXM per node
    desired_size: 4
    min_size: 4
    max_size: 4
    preemptible: false
    gpu_cluster: h100-cluster   # references gpu_clusters entry below
    labels:
      node-type: gpu-nvlink
      workload: inference-nvlink
      environment: production
      accelerator: nvidia-h100-sxm
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
      - key: workload
        value: inference-nvlink
        effect: NoSchedule

# GPU clusters — Nebius ComputeV1GpuCluster, InfiniBand-fabric-based multi-node
# GPU networking (labeled "NVIDIA H100 NVLink" in the Nebius console, which is
# a marketing/UI label — the underlying resource and interconnect is
# InfiniBand, confirmed via the Pulumi provider SDK: ComputeV1NvlInstanceGroup
# (actual cross-node NVLink Switch) only accepts type GB200/GB300, and does
# not support gpu-h100-sxm at all).
# infiniband_fabric must be a valid fabric ID for your Nebius project/region —
# check the Nebius console: Compute → GPU Clusters → Create, or
# https://docs.nebius.com/compute/clusters/gpu#fabrics
gpu_clusters:
  h100-cluster:
    infiniband_fabric: fabric-2
