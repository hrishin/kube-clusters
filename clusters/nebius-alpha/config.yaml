# Nebius MK8s cluster configuration.
cluster_name: nebius-alpha
project_id: "project-e00s6kp7pr00pxcs1xc9m4"
kubernetes_version: "1.34"
dns:
  zone: hrishi.dev
  name: cluster1.eu-north-1.kube.nebius

node_groups:
  default:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  core:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  # mimir:
  #   platform: cpu-d3
  #   preset: 16vcpu-64gb
  #   desired_size: 1
  #   min_size: 1
  #   max_size: 3
  #   preemptible: false
  #   labels:
  #     node-type: mimir
  #     workload: monitoring
  #     environment: production
  #   taints:
  #     - key: node-type
  #       value: mimir
  #       effect: NoSchedule


  gpu-inference:
    platform: gpu-h100-sxm
    preset: 1gpu-16vcpu-200gb
    desired_size: 1
    min_size: 1
    max_size: 4
    preemptible: true
    labels:
      node-type: gpu
      workload: inference
      environment: production
      accelerator: nvidia-h100-sxm
      # Partitions the GPU into one 4g.40gb MIG slice (qwen) + one 3g.40gb
      # slice (free for a second workload) instead of leaving it whole.
      # Config defined in iac-modules/extensions/nvidia-gpu-operator's
      # custom-mig-parted-config ConfigMap. Node-group label (not a
      # one-off kubectl label) so it survives replacement of this
      # preemptible node.
      nvidia.com/mig.config: 4g40gb-plus-3g40gb
      # Identifies DRA-consumer nodes to both gpu-operator's driver-manager
      # (NODE_LABEL_FOR_GPU_POD_EVICTION, so it can evict DRA ResourceClaim
      # pods before a driver reload) and the DRA driver's kubeletPlugin
      # nodeSelector.
      nvidia.com/dra-kubelet-plugin: "true"
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule

  # Multi-node H100 SXM serving, clustered via InfiniBand (NOT cross-node NVLink —
  # NVLink Switch fabric across servers only exists for GB200/GB300 platforms.
  # H100 SXM NVLink is intra-node only, 8 GPUs/server; cross-node communication
  # (TP/EP across the 4 nodes below) goes over InfiniBand via the GPU cluster
  # referenced below).
  # Sized for Kimi K3 (MXFP4, ~1.6TB weights): 3 nodes fit the weights but leave
  # too little KV headroom, 4 nodes is the practical minimum (see
  # docs/multi-node-inference-options.md
  # gpu-nvlink:
  #   platform: gpu-h100-sxm
  #   preset: 8gpu-128vcpu-1600gb        # 8 × H100 80 GB SXM per node
  #   desired_size: 4
  #   min_size: 4
  #   max_size: 4
  #   preemptible: false
  #   gpu_cluster: h100-cluster   # references gpu_clusters entry below
  #   labels:
  #     node-type: gpu-nvlink
  #     workload: inference-nvlink
  #     environment: production
  #     accelerator: nvidia-h100-sxm
  #   taints:
  #     - key: nvidia.com/gpu
  #       value: "true"
  #       effect: NoSchedule
  #     - key: workload
  #       value: inference-nvlink
  #       effect: NoSchedule

