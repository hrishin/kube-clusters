apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: main-gateway-tls
  namespace: kgateway-system
spec:
  secretName: main-gateway-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
  dnsNames:
    - cluster1.eu-north-1.kube.nebius.hrishi.dev
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
