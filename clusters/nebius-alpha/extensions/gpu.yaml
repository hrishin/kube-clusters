apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/nebius-alpha/extensions/gpu/
  prune: true
  # No wait: true — GPU nodes scale from 0 so pods may be pending for a while.
  # No dependsOn — runs independently; doesn't block crs or any other layer.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-outputs
        optional: false
