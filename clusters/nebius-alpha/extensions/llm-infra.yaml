apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-infra
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/nebius-alpha/extensions/llm-infra/
  prune: true
  # No wait: true — nvidia-gpu-operator's driver DaemonSet and the LWS
  # controller may sit pending for a while if GPU nodes are scaling from 0.
  # Same rationale as gpu.yaml. Decoupled from infra/system/crs so cold
  # GPU node scale-up never blocks core cluster bootstrap.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: crds
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-outputs
        optional: false
