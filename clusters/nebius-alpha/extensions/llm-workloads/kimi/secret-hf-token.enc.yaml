# Placeholder Secret for the Hugging Face access token, needed if
# moonshotai/Kimi-K3 (or its checkpoint repo) requires authenticated/gated
# access. Referenced by leadeworkerset.yaml via secretKeyRef as HF_TOKEN.
#
# This file is intentionally NOT listed in kustomization.yaml's resources —
# same reasoning as iac-modules/extensions/scaleway-ccm/v0.4.0-v1/secret.enc.yaml
# and iac-modules/extensions/fluxcd/v2.17.1-v1/secret-sops-age.yaml. If it were
# applied by Flux on every reconcile, it would stomp a real populated Secret
# with this empty placeholder. Create/manage the real Secret out-of-band, e.g.:
#
#   kubectl create secret generic hf-token \
#     --namespace vllm \
#     --from-literal=hf_token=<your-hf-token>
