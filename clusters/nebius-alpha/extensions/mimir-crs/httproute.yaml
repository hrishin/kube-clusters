---
# Exposes Mimir's query-frontend (read) and distributor (write) through
# the kgateway LoadBalancer on standard HTTP paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir
  namespace: mimir
spec:
  parentRefs:
    - name: main-gateway
      namespace: kgateway-system
  rules:
    # Prometheus remote-write → distributor
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      backendRefs:
        - name: mimir-distributor
          port: 8080
    # Grafana datasource queries → query-frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mimir-query-frontend
          port: 8080
