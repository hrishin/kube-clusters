apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-components
  namespace: flux-system
spec:
  interval: 1m50s
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/nebius-alpha/extensions/system-components/
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infra
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-outputs
        optional: false
