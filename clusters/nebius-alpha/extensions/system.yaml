apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system
  namespace: flux-system
spec:
  interval: 1m50s
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/nebius-alpha/extensions/system/
  prune: true
  wait: true
  dependsOn:
    - name: infra
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infra-outputs
        optional: false
