# Nebius MK8s cluster configuration.
cluster_name: nebius-prod
project_id: "project-e00s6kp7pr00pxcs1xc9m4"
kubernetes_version: "1.34"

node_groups:
  default:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  core:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  mimir:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 3
    preemptible: false
    labels:
      node-type: mimir
      workload: monitoring
      environment: production
    taints:
      - key: node-type
        value: mimir
        effect: NoSchedule

dns:
  # Public Nebius DNS zone for this cluster.
  # After phase-1 `pulumi up`, discover nameservers with:
  #   nebius dns zone get --id $(pulumi stack output dns_zone_id)
  # Then set them in Pulumi.prod.yaml (nebius_dns_nameservers) and re-run.
  zone_domain: "nebius.kube.hrishi.dev."
  cluster_subdomain: "cluster1.eu-north-1"
  lb_ip: "89.169.102.151"   # kgateway main-gateway LoadBalancer IP

