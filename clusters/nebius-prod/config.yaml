# Nebius MK8s cluster configuration.
cluster_name: nebius-prod
project_id: "project-e00s6kp7pr00pxcs1xc9m4"
kubernetes_version: "1.34"

node_groups:
  default:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  core:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 2
    preemptible: false
    labels:
      node-type: core
      workload: system
      environment: production

  mimir:
    platform: cpu-d3
    preset: 16vcpu-64gb
    desired_size: 1
    min_size: 1
    max_size: 3
    preemptible: false
    labels:
      node-type: mimir
      workload: monitoring
      environment: production
    taints:
      - key: node-type
        value: mimir
        effect: NoSchedule

  gpu-inference:
    platform: gpu-h100-sxm
    preset: 1gpu-16vcpu-200gb
    desired_size: 1
    min_size: 0
    max_size: 4
    preemptible: true
    labels:
      node-type: gpu
      workload: inference
      environment: production
      accelerator: nvidia-h100
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
