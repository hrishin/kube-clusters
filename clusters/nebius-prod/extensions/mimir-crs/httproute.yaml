---
# Exposes Mimir's query-frontend (read) and distributor (write) through
# the kgateway LoadBalancer on standard HTTP paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir
  namespace: mimir
spec:
  parentRefs:
    - name: main-gateway
      namespace: kgateway-system
  hostnames:
    - "mimir.nebius-prod.internal"   # override with your real domain or remove
  rules:
    # Prometheus remote-write → Mimir distributor
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/push
      backendRefs:
        - name: mimir-nginx
          port: 80
    # Grafana data source (query) → Mimir query-frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mimir-nginx
          port: 80
