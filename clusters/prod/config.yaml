node_groups:
  # Core compute nodes for general workloads
  core:
    instance_types: ["t2.medium"]
    await: true
    desired_size: 1
    min_size: 1
    max_size: 2
    disk_size: 20
    max_pods: 110
    ami_id: "ami-060bb37b943ff8d8e"
    ami_type: "CUSTOM"
    labels:
      node-type: "core"
      workload: "system"
      environment: "production"
    taints:
      - key: "node-type"
        value: "core"
        effect: "NoSchedule"

  # Mimir nodes - memory-optimized for metrics storage and Grafana
  mimir:
    instance_types: ["t3.large"]
    await: true
    desired_size: 1
    min_size: 1
    max_size: 3
    disk_size: 50
    max_pods: 110
    ami_id: "ami-060bb37b943ff8d8e"
    ami_type: "CUSTOM"
    labels:
      node-type: "mimir"
      workload: "monitoring"
      environment: "production"
    taints:
      - key: "node-type"
        value: "mimir"
        effect: "NoSchedule"

  logging:
    instance_types: ["t3.large"]
    await: true
    desired_size: 1
    min_size: 1
    max_size: 3
    disk_size: 50
    max_pods: 110
    ami_id: "ami-060bb37b943ff8d8e"
    ami_type: "CUSTOM"
    labels:
      node-type: "logging"
      workload: "monitoring"
      environment: "production"
    taints:
      - key: "node-type"
        value: "logging"
        effect: "NoSchedule"

  # G4 instances - spot, T4 GPU, inference workloads
  # desired_size=0: scale up manually or let cluster-autoscaler handle it once GPU workloads are scheduled.
  # NVIDIA GPU Operator (driver.enabled=true) installs the driver via container on first node join.
  g4-inference:
    instance_types: ["g4dn.xlarge", "g4dn.2xlarge"]
    capacity_type: "SPOT"
    desired_size: 1
    min_size: 0
    max_size: 3
    disk_size: 50
    ami_id: "ami-060bb37b943ff8d8e"
    ami_type: "CUSTOM"
    availability_zones: ["eu-west-2a", "eu-west-2c"]  # Exclude eu-west-2b due to g4dn.xlarge capacity issues
    labels:
      node-type: "gpu"
      workload: "inference"
      environment: "production"
      accelerator: "nvidia-t4"
      gpu-type: "g4"
    taints:
      - key: "nvidia.com/gpu"
        value: "true"
        effect: "NoSchedule"
      - key: "workload"
        value: "inference"
        effect: "NoSchedule"

