apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: main-gateway-tls
  namespace: kgateway-system
spec:
  secretName: main-gateway-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
  dnsNames:
    # Must match dns.name + dns.zone in clusters/verda-alpha/config.yaml.
    - cluster1.fin-03.kube.verda.hrishi.dev
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
