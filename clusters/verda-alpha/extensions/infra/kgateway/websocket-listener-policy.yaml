apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: main-gateway-websocket
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
  # Without this, Envoy passes Connection:Upgrade requests through as plain
  # HTTP instead of switching protocols, which is what broke open-webui's
  # socket.io websocket (curl repro: backend saw a non-upgraded request and
  # replied 400 "Invalid WebSocket upgrade request").
  upgradeConfig:
    enabledUpgrades:
      - websocket
