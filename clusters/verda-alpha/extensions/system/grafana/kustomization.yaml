apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - ../../../../../iac-modules/extensions/namespace/v1/
  - ../../../../../iac-modules/extensions/mimir/v2.14.0-v1/
  - ../../../../../iac-modules/extensions/grafana/v11.0.0-v1/
patches:
  - patch: |
      - op: replace
        path: /spec/values/env/GF_SERVER_ROOT_URL
        value: "https://cluster1.fin-03.kube.verda.hrishi.dev/grafana"
    target:
      kind: HelmRelease
      name: grafana
  # Same HelmRepository-name clash and sourceRef fix-ups as nebius-alpha:
  # mimir and grafana each vendor a HelmRepository called "grafana".
  - patch: |
      - op: replace
        path: /metadata/name
        value: mimir-charts
    target:
      kind: HelmRepository
      namespace: mimir
      name: grafana
  - patch: |
      - op: replace
        path: /spec/chart/spec/sourceRef/namespace
        value: grafana
    target:
      kind: HelmRelease
      name: grafana
  - patch: |
      - op: replace
        path: /spec/chart/spec/sourceRef
        value:
          kind: HelmRepository
          name: mimir-charts
          namespace: grafana
    target:
      kind: HelmRelease
      name: mimir
  # verda-alpha has no dedicated `mimir` node group (Nebius does); every
  # Mimir component runs on the tainted core nodes instead. Merge patch so
  # the module's per-component values (replicas, PVCs) stay untouched.
  - target:
      kind: HelmRelease
      name: mimir
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: mimir
      spec:
        values:
          alertmanager:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          compactor:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          distributor:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          ingester:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          overrides_exporter:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          querier:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          query_frontend:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          query_scheduler:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          rollout_operator:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          ruler:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
          store_gateway:
            nodeSelector:
              node-type: core
            tolerations:
              - key: node-type
                operator: Equal
                value: core
                effect: NoSchedule
