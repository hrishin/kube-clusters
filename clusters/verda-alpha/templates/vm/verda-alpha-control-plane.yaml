# Verda CLI template — install with:
#   mkdir -p ~/.verda/templates/vm && cp clusters/verda-alpha/templates/vm/*.yaml ~/.verda/templates/vm/
#   verda vm create --from verda-alpha-control-plane
# Templates are local CLI conveniences (not synced to the API); the Terraform
# root under infra/ is the source of truth for the cluster.
kind: cpu
instance_type: CPU.8V.32G
image: ubuntu-24.04
location: FIN-03
os_volume_size: 100
ssh_keys:
  - 5ba6b5ca-a721-4d3a-ac47-9411cb900e67
hostname_pattern: "verda-alpha-cp-{random}"
storage_skip: true
startup_script_skip: true
