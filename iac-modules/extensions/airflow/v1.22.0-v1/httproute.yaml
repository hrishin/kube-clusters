apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airflow
  namespace: airflow
spec:
  parentRefs:
    - name: main-gateway
      namespace: kgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /airflow
      backendRefs:
        # Service name/port follow the chart's release-name templating
        # (`<releaseName>-api-server`, ports.apiServer default 8080) — not
        # yet confirmed against a live `kubectl get svc -n airflow`.
        # Unlike Grafana (GF_SERVER_SERVE_FROM_SUB_PATH), no equivalent
        # sub-path setting was found in this chart's values — the UI/API may
        # need `AIRFLOW__API__BASE_URL` (or similar) set under `airflow.cfg`
        # / `config.api` for links and static assets to render correctly
        # under `/airflow` rather than `/`. Verify after first deploy.
        - name: airflow-api-server
          port: 8080
