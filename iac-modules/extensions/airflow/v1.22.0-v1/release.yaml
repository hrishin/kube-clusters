apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: airflow
spec:
  releaseName: airflow
  chart:
    spec:
      chart: airflow
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: airflow
  interval: 2m
  timeout: 15m
  # createUserJob.defaultUser.password has no secretKeyRef-style option in
  # this chart (must be a plaintext Helm value) — sourced via valuesFrom
  # from a sops-encrypted Secret instead of the chart default ("admin"),
  # same reasoning as the Cloudflare token: this UI is reachable through
  # the public gateway at /airflow.
  valuesFrom:
    - kind: Secret
      name: airflow-admin-password
      valuesKey: values.yaml
  # The chart's airflow-run-airflow-migrations/airflow-create-user Jobs are
  # post-install hooks — they only run once Helm considers the main release
  # Ready. But every Deployment/StatefulSet pod has a wait-for-migrations
  # init container that blocks until those same migrations have already run.
  # With the default wait behavior, helm-controller waits for pods to be
  # Ready before running post-install hooks, and the pods wait for the hooks
  # — a deadlock (confirmed live: release sat in Helm status
  # "pending-install" indefinitely, and the migration Job was never even
  # created). disableWait[ForJobs] lets Helm apply the release and fire the
  # hooks without waiting on pod readiness first, breaking the cycle.
  install:
    disableWait: true
    disableWaitForJobs: true
  upgrade:
    disableWait: true
    disableWaitForJobs: true
  values:
    # KubernetesExecutor over the chart's default CeleryExecutor — runs each
    # task as its own pod instead of needing a standing Celery worker pool +
    # Redis broker, which is unused infra for what's otherwise a
    # single-node/dev setup here.
    executor: KubernetesExecutor
    redis:
      enabled: false

    postgresql:
      enabled: true
      primary:
        persistence:
          storageClassName: local-path
          size: 8Gi

    dags:
      # No gitSync configured (see below), and DAGs are now delivered via a
      # kustomize-generated ConfigMap (dags/*.py -> airflow-dags, mounted
      # into scheduler/dagProcessor/apiServer below) instead — the PVC this
      # was reserved for has no writer without gitSync.
      persistence:
        enabled: false
      gitSync:
        enabled: false
        # Point at the actual DAGs repo and flip enabled: true once one
        # exists. Left disabled rather than pointed at a placeholder URL.
        # repo: https://github.com/<org>/<dags-repo>.git
        # branch: main
        # subPath: dags

    # action_linux_llm_finetune (see dags/) needs a HuggingFace token to
    # push the processed dataset and trained model — see
    # secret-hf-token.enc.yaml (ships with a placeholder value, replace via
    # sops before running the DAG).
    extraEnvFrom: |
      - secretRef:
          name: hf-token

    scheduler:
      extraVolumes:
        - name: dags
          configMap:
            name: airflow-dags
      # subPath, not a directory mount: mounting the whole ConfigMap at
      # /opt/airflow/dags gives kubelet its usual ..data -> ..<timestamp>
      # symlink-based atomic-update layout, and Airflow's DAG-folder walker
      # (which follows symlinks, for git-sync's sake) misreads that as a
      # recursive loop and refuses to scan the directory at all — confirmed
      # live: "RuntimeError: Detected recursive loop when walking DAG
      # directory". subPath mounts a plain regular file instead, no symlink
      # structure, at the cost of no live updates on ConfigMap change (a
      # subPath-mounted file only re-syncs on pod restart) — acceptable
      # here since a DAG content change already means a new Flux-driven
      # Helm upgrade/rollout anyway.
      extraVolumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags/action_linux_llm_finetune.py
          subPath: action_linux_llm_finetune.py
          readOnly: true

    dagProcessor:
      extraVolumes:
        - name: dags
          configMap:
            name: airflow-dags
      # subPath, not a directory mount: mounting the whole ConfigMap at
      # /opt/airflow/dags gives kubelet its usual ..data -> ..<timestamp>
      # symlink-based atomic-update layout, and Airflow's DAG-folder walker
      # (which follows symlinks, for git-sync's sake) misreads that as a
      # recursive loop and refuses to scan the directory at all — confirmed
      # live: "RuntimeError: Detected recursive loop when walking DAG
      # directory". subPath mounts a plain regular file instead, no symlink
      # structure, at the cost of no live updates on ConfigMap change (a
      # subPath-mounted file only re-syncs on pod restart) — acceptable
      # here since a DAG content change already means a new Flux-driven
      # Helm upgrade/rollout anyway.
      extraVolumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags/action_linux_llm_finetune.py
          subPath: action_linux_llm_finetune.py
          readOnly: true

    nodeSelector:
      node-type: core
    tolerations:
      - key: node-type
        operator: Equal
        value: core
        effect: NoSchedule

    # Served behind kgateway at /airflow (see httproute.yaml), not at
    # domain root. Without base_url the API server doesn't know it's
    # mounted under a sub-path, so the React UI emits asset/API URLs at
    # "/" instead of "/airflow/" — confirmed live: GET
    # /static/assets/index-*.js 404s because the request never carries
    # the /airflow prefix the HTTPRoute matches on.
    # https://airflow.apache.org/docs/apache-airflow/3.2.2/howto/run-behind-proxy.html
    config:
      api:
        base_url: "https://cluster1.eu-north-1.kube.nebius.hrishi.dev/airflow"
    apiServer:
      args: ["bash", "-c", "exec airflow api-server --proxy-headers"]
      env:
        - name: FORWARDED_ALLOW_IPS
          value: "*"
      extraVolumes:
        - name: dags
          configMap:
            name: airflow-dags
      # subPath, not a directory mount: mounting the whole ConfigMap at
      # /opt/airflow/dags gives kubelet its usual ..data -> ..<timestamp>
      # symlink-based atomic-update layout, and Airflow's DAG-folder walker
      # (which follows symlinks, for git-sync's sake) misreads that as a
      # recursive loop and refuses to scan the directory at all — confirmed
      # live: "RuntimeError: Detected recursive loop when walking DAG
      # directory". subPath mounts a plain regular file instead, no symlink
      # structure, at the cost of no live updates on ConfigMap change (a
      # subPath-mounted file only re-syncs on pod restart) — acceptable
      # here since a DAG content change already means a new Flux-driven
      # Helm upgrade/rollout anyway.
      extraVolumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags/action_linux_llm_finetune.py
          subPath: action_linux_llm_finetune.py
          readOnly: true
