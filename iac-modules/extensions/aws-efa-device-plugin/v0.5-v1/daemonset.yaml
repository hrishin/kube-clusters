apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-efa-k8s-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: aws-efa-k8s-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: aws-efa-k8s-device-plugin
    spec:
      # Only run on nodes with EFA hardware
      nodeSelector:
        feature.node.kubernetes.io/pci-1d0f.present: "true"  # AWS device vendor ID
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostNetwork: true
      containers:
        - name: aws-efa-k8s-device-plugin
          image: 602401143452.dkr.ecr.eu-west-2.amazonaws.com/eks/aws-efa-k8s-device-plugin:v0.5.7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
