# Placeholder Secret for the SOPS age identity (private key) that Flux's
# kustomize-controller needs to decrypt *.enc.yaml files (e.g. config/*.enc.yaml,
# see .sops.yaml at the repo root for the corresponding age *public* key used
# to encrypt them).

apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
stringData:
  age.agekey: ""
