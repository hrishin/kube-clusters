apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: "8.5.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  interval: 2m
  values:
    tolerations:
      - key: node-type
        operator: Equal
        value: core
        effect: NoSchedule
    nodeSelector:
      node-type: core

    env:
      GF_SERVER_ROOT_URL: "https://${NLB_DNS}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    # Dashboards are shipped as ConfigMaps (label grafana_dashboard: "1")
    # co-located with the app they monitor, e.g.
    # iac-modules/extensions/spegel/v0.7.4-v1/grafana-dashboard.yaml. The
    # sidecar watches every namespace so a dashboard doesn't have to live in
    # `monitoring` to be picked up; rbac.create (default true) already
    # covers the ClusterRole this needs.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Mimir
            type: prometheus
            url: http://main-gateway.kgateway-system.svc.cluster.local:80/mimir/prometheus
            access: proxy
            isDefault: true
          - name: Tempo
            type: tempo
            url: http://tempo.monitoring.svc.cluster.local:3100
            access: proxy

    initChownData:
      enabled: false

    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path
