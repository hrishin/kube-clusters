apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-prefetch
spec:
  selector:
    matchLabels:
      app: image-prefetch
  template:
    metadata:
      labels:
        app: image-prefetch
    spec:
      # Runs on the always-on core nodes rather than the GPU node group —
      # the GPU node is the one that actually needs the fast pull. Landing
      # the image in containerd's content store here lets Spegel's P2P
      # mirror serve it to a cold GPU node instead of that node pulling the
      # full image straight from Docker Hub itself.
      nodeSelector:
        node-type: core
      containers:
        - name: vllm-openai
          # Keep in sync with iac-modules/extensions/qwen/v0.9-v1/deployment.yaml
          image: vllm/vllm-openai:v0.9.1
          # Override the entrypoint: this container only needs to exist long
          # enough for containerd to pull the image. Running vLLM's actual
          # entrypoint would look for a GPU and crash-loop on a core node.
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: gpu-operator
          # Keep in sync with chart.spec.version in
          # iac-modules/extensions/nvidia-gpu-operator/v26.3-v1/base/gpu-operator-release.yaml.
          # The gpu-operator controller itself runs on core nodes too (see
          # operator.nodeSelector in that HelmRelease), and its image is what
          # dominated node-ready-to-device-plugin-initialized on a fresh
          # node — the controller can't create the driver/toolkit/device-plugin
          # DaemonSets until its own pod finishes pulling nvcr.io/nvidia/gpu-operator,
          # which took ~5.5min from cold on nvcr.io with nothing cached yet.
          image: nvcr.io/nvidia/gpu-operator:v26.3.3
          # Unlike vllm-openai's GNU coreutils, this image's `sleep` is a
          # BusyBox applet that doesn't understand "infinity" — it silently
          # treats it as 0 and exits immediately, crash-looping forever.
          # Loop a bounded sleep instead, which works on any sleep impl.
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      terminationGracePeriodSeconds: 5
