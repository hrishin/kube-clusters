---
# LWS creates its own headless service for pod DNS (used by LWS_LEADER_ADDRESS).
# This ClusterIP service exposes only the leader pod for inference traffic.
# LWS labels leaders with worker-index "0"; workers with "1", "2", "3".
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3
spec:
  selector:
    app: kimi-k3
    role: leader    # only the leader pod runs the HTTP API server
  ports:
  - name: http
    port: 30000
    targetPort: 30000
    protocol: TCP
