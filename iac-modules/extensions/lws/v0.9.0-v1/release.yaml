apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lws
  namespace: lws-system
spec:
  releaseName: lws
  chart:
    spec:
      chart: lws
      version: "v0.9.0"
      sourceRef:
        kind: HelmRepository
        name: lws
  interval: 2m
  # CRDs are applied separately via the crds Flux Kustomization
  # (iac-modules/extensions/crds/lws/v0.9.0/) — the chart's README notes CRD
  # schema changes do not reach the cluster through `helm upgrade`, so we
  # manage them outside the Helm release lifecycle, same as cert-manager.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    # Controller Deployment is not a GPU workload — run it on core nodes
    # alongside the other cluster controllers.
    nodeSelector:
      node-type: core
    tolerations:
      - key: node-type
        operator: Equal
        value: core
        effect: NoSchedule
