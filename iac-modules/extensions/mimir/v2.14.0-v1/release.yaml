apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
  namespace: mimir
spec:
  releaseName: mimir
  chart:
    spec:
      chart: mimir-distributed
      version: "5.6.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: mimir
  interval: 2m
  values:
    global:
      dnsService: coredns
      dnsNamespace: kube-system

    minio:
      enabled: false

    mimir:
      structuredConfig:
        multitenancy_enabled: false
        common:
          storage:
            backend: filesystem
        usage_stats:
          enabled: false
        blocks_storage:
          backend: filesystem
          filesystem:
            dir: /data/blocks
        alertmanager_storage:
          backend: filesystem
          filesystem:
            dir: /data/alertmanager
        ruler_storage:
          backend: filesystem
          filesystem:
            dir: /data/ruler
        alertmanager:
          data_dir: /data/alertmanager-work
        compactor:
          data_dir: /data/compactor-work
        ruler:
          rule_path: /data/ruler-work
        ingester:
          ring:
            replication_factor: 1
        # Default (150000) is sized for a demo/single-app setup. kube-state-metrics
        # + kubelet/cadvisor + node-exporter across even a handful of nodes
        # routinely exceeds that on their own, which was silently dropping
        # ~97% of remote_write samples (err-mimir-max-series-per-user).
        limits:
          max_global_series_per_user: 1000000

    ingester:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path

    store_gateway:
      replicas: 1
      zoneAwareReplication:
        enabled: false
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path

    compactor:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path

    alertmanager:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
      persistentVolume:
        enabled: true
        size: 1Gi
        storageClass: local-path

    distributor:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir

    querier:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir

    query_frontend:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir

    query_scheduler:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir

    ruler:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
      persistentVolume:
        enabled: true
        size: 2Gi
        storageClass: local-path

    nginx:
      enabled: false

    overrides_exporter:
      replicas: 1
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir

    rollout_operator:
      tolerations:
        - key: node-type
          operator: Equal
          value: mimir
          effect: NoSchedule
      nodeSelector:
        node-type: mimir
