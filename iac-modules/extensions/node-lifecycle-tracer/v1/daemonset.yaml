apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-lifecycle-tracer
spec:
  selector:
    matchLabels:
      app: node-lifecycle-tracer
  template:
    metadata:
      labels:
        app: node-lifecycle-tracer
    spec:
      serviceAccountName: node-lifecycle-tracer
      nodeSelector:
        node-type: gpu
      tolerations:
        - key: workload
          operator: Equal
          value: inference
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command:
            - pip
            - install
            - --target=/deps
            - kubernetes==31.0.0
            - opentelemetry-sdk==1.33.1
            - opentelemetry-exporter-otlp-proto-grpc==1.33.1
            - requests==2.32.3
          volumeMounts:
            - name: deps
              mountPath: /deps
      containers:
        - name: tracer
          image: python:3.12-slim
          command:
            - python
            - /scripts/tracer.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "node-lifecycle-tracer"
            - name: VLLM_SERVICE_URL
              value: "http://vllm-qwen2-5-7b.vllm.svc.cluster.local:8000"
            - name: PYTHONPATH
              value: "/deps"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: deps
              mountPath: /deps
      volumes:
        - name: script
          configMap:
            name: node-lifecycle-tracer-script
        - name: deps
          emptyDir: {}
      restartPolicy: Always
