apiVersion: v1
kind: ConfigMap
metadata:
  name: node-lifecycle-tracer-script
data:
  tracer.py: |
    #!/usr/bin/env python3
    """
    GPU node cold-start lifecycle tracer.

    Waits for each phase to complete on THIS node before recording its timestamp:
      Node launch → K8s registered → Node Ready → NVIDIA initialized
      → app scheduled → image pull start → image pull complete
      → container started → model loaded (/health 200)

    "app" is workload-specific, picked from the node's own `workload` label:
      workload=inference          → single-GPU vLLM (app=vllm-qwen2-5-7b, port 8000)
      workload=inference-nvlink   → Kimi K3 multi-node LWS (app=kimi-k3, port 30000)

    Kimi K3 is a 4-node LeaderWorkerSet (1 leader + 3 workers). Only the
    leader pod ever binds an HTTP server — SGLang doesn't start one on worker
    ranks (see iac-modules/extensions/kimi/vk3-v1/leadeworkerset.yaml). So
    "model ready" for a node running a WORKER pod can't be determined from
    that pod alone: it's read off the leader pod's own Ready condition
    instead, since the whole 4-node NCCL/rendezvous group has to complete
    before the leader's readinessProbe (also /health) goes green — which is
    the actual "this group can serve requests" signal regardless of which
    node you're tracing from.

    "Model ready" timestamps (vLLM, Kimi leader) are read from the pod's own
    Ready condition rather than polled directly by this script: both already
    carry an HTTP readinessProbe against /health, so kubelet has already
    recorded the real transition time. Re-polling here would instead record
    "ready" as merely the moment THIS script got around to checking — wrong
    (too late, sometimes wildly so) whenever this DaemonSet pod itself
    starts, restarts, or gets rescheduled after the app is already healthy.

    Uses IMDS for EC2 launch time (no IAM needed; falls back to node creation
    time if IMDS is unavailable, e.g. on non-AWS clouds). Polls node/pod
    conditions via in-cluster K8s API.
    """

    import logging
    import os
    import time
    from datetime import datetime, timezone

    import requests
    from kubernetes import client as k8s
    from kubernetes import config as k8sconfig
    from opentelemetry import trace
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.trace import set_span_in_context

    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("node-lifecycle-tracer")

    POLL = 10   # seconds between polls
    TIMEOUT = 1800  # 30 min overall timeout


    def to_ns(dt) -> int:
        if isinstance(dt, str):
            dt = datetime.fromisoformat(dt.replace("Z", "+00:00"))
        return int(dt.timestamp() * 1e9)


    def imds_launch_time() -> datetime:
        token = requests.put(
            "http://169.254.169.254/latest/api/token",
            headers={"X-aws-ec2-metadata-token-ttl-seconds": "60"},
            timeout=3,
        ).text
        doc = requests.get(
            "http://169.254.169.254/latest/dynamic/instance-identity/document",
            headers={"X-aws-ec2-metadata-token": token},
            timeout=3,
        ).json()
        return datetime.fromisoformat(doc["pendingTime"].replace("Z", "+00:00"))


    def wait_node_ready(v1, node_name: str, deadline: float) -> tuple[datetime, datetime]:
        """Return (node_created, node_ready_time). Blocks until Ready."""
        while time.time() < deadline:
            node = v1.read_node(node_name)
            created = node.metadata.creation_timestamp
            for cond in node.status.conditions or []:
                if cond.type == "Ready" and cond.status == "True":
                    log.info(f"Node Ready at {cond.last_transition_time}")
                    return created, cond.last_transition_time
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for node Ready")


    def wait_gpu_runtime_ready(v1, node_name: str, deadline: float) -> tuple[datetime, str]:
        """Wait for this node's GPU allocation mechanism to come up, whichever
        flavor gpu-operator is running here — DRA kubelet plugin (+
        ResourceSlice) or the classic device plugin. Both are checked every
        poll rather than picked upfront: node labels like
        nvidia.com/dra-kubelet-plugin describe node-group/eviction wiring,
        not which flavor is actually deployed, so they aren't a reliable
        signal of which one to wait for.
        Returns (ready_time, flavor) where flavor is "dra" or "device-plugin",
        so callers can name spans after whichever one was actually seen."""
        dra_selectors = [
            "app=nvidia-dra-driver-gpu-kubelet-plugin",
            "app.kubernetes.io/name=nvidia-dra-driver-gpu",
        ]
        while time.time() < deadline:
            for sel in dra_selectors:
                pods = v1.list_pod_for_all_namespaces(
                    label_selector=sel,
                    field_selector=f"spec.nodeName={node_name}",
                ).items
                for pod in pods:
                    for cond in pod.status.conditions or []:
                        if cond.type == "Ready" and cond.status == "True":
                            log.info(f"DRA driver ready at {cond.last_transition_time} ({pod.metadata.name})")
                            return cond.last_transition_time, "dra"
            # fallback: ResourceSlice exists for this node. Use its own
            # creationTimestamp (a real historical event kubernetes already
            # recorded), not datetime.now() — "now" would suffer the exact
            # late-poll bug described above whenever this tracer starts late.
            try:
                ra = k8s.CustomObjectsApi()
                slices = ra.list_cluster_custom_object(
                    "resource.k8s.io", "v1", "resourceslices",
                    label_selector=f"resource.k8s.io/node-name={node_name}",
                ).get("items", [])
                if slices:
                    t = min(s["metadata"]["creationTimestamp"] for s in slices)
                    log.info(f"ResourceSlice appeared at {t}")
                    return t, "dra"
            except Exception:
                pass
            # classic device plugin: its daemonset pod goes Ready on this
            # node once it's registered GPU/MIG resources with kubelet
            pods = v1.list_pod_for_all_namespaces(
                label_selector="app=nvidia-device-plugin-daemonset",
                field_selector=f"spec.nodeName={node_name}",
            ).items
            for pod in pods:
                for cond in pod.status.conditions or []:
                    if cond.type == "Ready" and cond.status == "True":
                        log.info(f"Device plugin ready at {cond.last_transition_time} ({pod.metadata.name})")
                        return cond.last_transition_time, "device-plugin"
            log.info("Waiting for DRA driver / ResourceSlice / device plugin...")
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for GPU runtime (DRA driver or device plugin)")


    def get_image_pull_times(v1, pod):
        """First 'Pulling' event to the 'Pulled' event for this pod (spans any
        failed retries — 'Pulling' events aggregate repeat attempts of the same
        image into one Event object, with first_timestamp at the earliest one)."""
        events = v1.list_namespaced_event(
            pod.metadata.namespace,
            field_selector=f"involvedObject.name={pod.metadata.name}",
        ).items
        pull_start = pull_complete = None
        for e in events:
            if e.reason == "Pulling":
                pull_start = e.first_timestamp or e.event_time
            elif e.reason == "Pulled":
                pull_complete = e.last_timestamp or e.first_timestamp or e.event_time
        return pull_start, pull_complete


    def wait_vllm_on_node(v1, node_name: str, deadline: float):
        """Wait for a vLLM pod to be scheduled AND running on this specific node.
        Returns (scheduled_at, pull_start, pull_complete, started_at, pod, pod_uid)."""
        while time.time() < deadline:
            pods = v1.list_pod_for_all_namespaces(
                label_selector="app=vllm-qwen2-5-7b",
                field_selector=f"spec.nodeName={node_name}",
            ).items
            for pod in pods:
                scheduled_at = None
                for cond in pod.status.conditions or []:
                    if cond.type == "PodScheduled":
                        scheduled_at = cond.last_transition_time
                started_at = None
                for cs in pod.status.container_statuses or []:
                    if (cs.name == "qwen" or cs.name == "vllm") and cs.state and cs.state.running:
                        started_at = cs.state.running.started_at
                if started_at:
                    pull_start, pull_complete = get_image_pull_times(v1, pod)
                    log.info(f"vLLM container started at {started_at} ({pod.metadata.name})")
                    return scheduled_at, pull_start, pull_complete, started_at, pod, pod.metadata.uid
                if scheduled_at:
                    log.info(f"vLLM scheduled at {scheduled_at}, waiting for container start...")
            log.info("Waiting for vLLM pod on this node...")
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for vLLM pod on this node")


    def pod_ready_time(v1, namespace: str, name: str):
        """The Ready condition's lastTransitionTime, or None if not Ready
        (or the pod is gone — a rollout may have already replaced it)."""
        try:
            pod = v1.read_namespaced_pod(name, namespace)
        except k8s.exceptions.ApiException as e:
            if e.status == 404:
                return None
            raise
        for cond in pod.status.conditions or []:
            if cond.type == "Ready" and cond.status == "True":
                return cond.last_transition_time
        return None


    def wait_vllm_health(v1, pod, deadline: float) -> datetime:
        """vLLM carries a readinessProbe against /health (see
        iac-modules/extensions/qwen's deployment.yaml) — read kubelet's own
        record of when that started passing instead of polling ourselves."""
        while time.time() < deadline:
            ready = pod_ready_time(v1, pod.metadata.namespace, pod.metadata.name)
            if ready:
                log.info(f"vLLM Ready at {ready} ({pod.metadata.name})")
                return ready
            log.info(f"Waiting for vLLM pod {pod.metadata.name} to become Ready...")
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for vLLM health")


    def wait_kimi_pod_on_node(v1, node_name: str, deadline: float):
        """Wait for a kimi-k3 pod (leader OR worker) to be scheduled AND running
        on this specific node.
        Returns (scheduled_at, pull_start, pull_complete, started_at, pod, role, pod_uid)."""
        while time.time() < deadline:
            pods = v1.list_pod_for_all_namespaces(
                label_selector="app=kimi-k3",
                field_selector=f"spec.nodeName={node_name}",
            ).items
            for pod in pods:
                role = pod.metadata.labels.get("role", "unknown")
                scheduled_at = None
                for cond in pod.status.conditions or []:
                    if cond.type == "PodScheduled":
                        scheduled_at = cond.last_transition_time
                started_at = None
                for cs in pod.status.container_statuses or []:
                    if cs.name == "sglang" and cs.state and cs.state.running:
                        started_at = cs.state.running.started_at
                if started_at:
                    pull_start, pull_complete = get_image_pull_times(v1, pod)
                    log.info(f"Kimi K3 ({role}) container started at {started_at} ({pod.metadata.name})")
                    return scheduled_at, pull_start, pull_complete, started_at, pod, role, pod.metadata.uid
                if scheduled_at:
                    log.info(f"Kimi K3 ({role}) scheduled at {scheduled_at}, waiting for container start...")
            log.info("Waiting for kimi-k3 pod on this node...")
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for kimi-k3 pod on this node")


    def wait_kimi_ready(v1, pod, role: str, deadline: float) -> datetime:
        """
        Leader: it carries a readinessProbe against /health (same rationale
        as vLLM) — read kubelet's own record of when that started passing.
        Worker: a worker's own readinessProbe is just `pgrep sglang` (SGLang
        never starts an HTTP server on worker ranks), so it does NOT mean the
        group can serve requests — that can only be read off the LEADER's
        Ready condition. Look the current leader pod up by label rather than
        going through the Service, so a rolling replacement can't land on a
        stale pod behind the ClusterIP.
        """
        while time.time() < deadline:
            if role == "leader":
                ready = pod_ready_time(v1, pod.metadata.namespace, pod.metadata.name)
            else:
                ready = None
                leaders = v1.list_namespaced_pod(
                    pod.metadata.namespace,
                    label_selector="app=kimi-k3,role=leader",
                ).items
                for leader in leaders:
                    for cond in leader.status.conditions or []:
                        if cond.type == "Ready" and cond.status == "True":
                            ready = cond.last_transition_time
                            break
            if ready:
                log.info(f"Kimi K3 ({role}) group ready at {ready}")
                return ready
            log.info(f"Waiting for kimi-k3 ({role}) group readiness...")
            time.sleep(POLL)
        raise TimeoutError("Timed out waiting for kimi-k3 health")


    def container_state(pod, container_name: str):
        """(started_at, restart_count) for the named container, or
        (None, restart_count) if it isn't running right now."""
        restart_count = 0
        for cs in pod.status.container_statuses or []:
            if cs.name == container_name:
                restart_count = cs.restart_count
                if cs.state and cs.state.running:
                    return cs.state.running.started_at, restart_count
        return None, restart_count


    def trace_one_start(tracer, v1, node_name: str, app: str, pod, started_at,
                         restart_count: int, is_new_pod: bool,
                         health_check, extra_attrs: dict):
        """Build and emit a single trace for one observed container start —
        either a brand-new pod (a Deployment/LWS rollout) or a restart of an
        already-running pod's container."""
        scheduled_at = None
        for cond in pod.status.conditions or []:
            if cond.type == "PodScheduled":
                scheduled_at = cond.last_transition_time
        # A same-pod restart normally reuses the already-cached image (no new
        # Pulling/Pulled event), so pull_start/pull_complete legitimately stay
        # None here — emit() already skips spans whose start is None.
        pull_start, pull_complete = get_image_pull_times(v1, pod)

        deadline = time.time() + TIMEOUT
        try:
            ready = health_check(pod, deadline)
        except TimeoutError:
            log.warning(f"{app} on {pod.metadata.name} did not become healthy after "
                        f"{'start' if is_new_pod else 'restart'}; skipping trace for this event")
            return

        event = "new-pod" if is_new_pod else "container-restart"
        log.info(f"{app} {event}: pod={pod.metadata.name} restart_count={restart_count}")

        spans = [
            (f"{app}-scheduled-to-image-pull-start",  scheduled_at,  pull_start,     {"phase": "runtime"}),
            (f"{app}-image-pull",                     pull_start,    pull_complete,  {"phase": "runtime", "description": "image pull time"}),
            (f"{app}-image-pull-to-container-start",  pull_complete, started_at,     {"phase": "runtime"}),
            (f"{app}-container-start-to-model-ready",  started_at,   ready,          {"phase": "model-load"}),
        ]
        emit(tracer, {
            "node.name": node_name,
            "app": app,
            "pod.name": pod.metadata.name,
            "pod.uid": pod.metadata.uid,
            "restart_count": restart_count,
            "event.type": event,
            **extra_attrs,
        }, spans, root_name=f"{app}-pod-lifecycle")


    def watch_vllm_lifecycle(tracer, v1, node_name: str, seen: dict):
        """
        Runs forever: watches for new vllm-qwen2-5-7b pods (a Deployment
        rollout replacing the pod) or container restarts on this node, and
        emits a fresh trace for each one. `seen` maps pod UID to the last
        started_at we've already traced for it, so the pod the initial full
        trace already covered isn't re-emitted.
        """
        while True:
            try:
                pods = v1.list_pod_for_all_namespaces(
                    label_selector="app=vllm-qwen2-5-7b",
                    field_selector=f"spec.nodeName={node_name}",
                ).items
                for pod in pods:
                    started_at, restart_count = container_state(pod, "qwen")
                    if started_at is None:
                        continue
                    uid = pod.metadata.uid
                    key = str(started_at)
                    if seen.get(uid) == key:
                        continue
                    is_new_pod = uid not in seen
                    seen[uid] = key
                    trace_one_start(
                        tracer, v1, node_name, "vllm", pod, started_at,
                        restart_count, is_new_pod,
                        lambda p, dl: wait_vllm_health(v1, p, dl), {},
                    )
            except Exception:
                log.exception("Error while watching for vLLM pod restarts")
            time.sleep(POLL)


    def watch_kimi_lifecycle(tracer, v1, node_name: str, seen: dict):
        """Same as watch_vllm_lifecycle, for the kimi-k3 LeaderWorkerSet."""
        while True:
            try:
                pods = v1.list_pod_for_all_namespaces(
                    label_selector="app=kimi-k3",
                    field_selector=f"spec.nodeName={node_name}",
                ).items
                for pod in pods:
                    started_at, restart_count = container_state(pod, "sglang")
                    if started_at is None:
                        continue
                    uid = pod.metadata.uid
                    key = str(started_at)
                    if seen.get(uid) == key:
                        continue
                    is_new_pod = uid not in seen
                    seen[uid] = key
                    role = pod.metadata.labels.get("role", "unknown")
                    health_check = lambda p, dl, role=role: wait_kimi_ready(v1, p, role, dl)
                    trace_one_start(
                        tracer, v1, node_name, "kimi-k3", pod, started_at,
                        restart_count, is_new_pod, health_check, {"kimi.role": role},
                    )
            except Exception:
                log.exception("Error while watching for kimi-k3 pod restarts")
            time.sleep(POLL)


    def emit(tracer, attrs: dict, spans: list[tuple], root_name: str = "gpu-node-cold-start"):
        if not spans:
            return
        root_start = spans[0][1]
        root_end = spans[-1][2] or spans[-1][1]
        root = tracer.start_span(root_name, start_time=to_ns(root_start))
        for k, v in attrs.items():
            root.set_attribute(k, v)
        root_ctx = set_span_in_context(root)
        for name, start, end, extra in spans:
            if start is None:
                continue
            end = end or start
            if end < start:
                # Two independently-timestamped signals (e.g. a kubelet Ready
                # condition vs. a scheduler decision) can land a second or two
                # out of order. Clamp to zero rather than emit a negative
                # duration — some trace UIs render that as a huge bogus value
                # via unsigned-integer wraparound.
                end = start
            s = tracer.start_span(name, context=root_ctx, start_time=to_ns(start))
            for k, v in (extra or {}).items():
                s.set_attribute(k, v)
            s.end(end_time=to_ns(end))
        root.end(end_time=to_ns(root_end))


    def main():
        endpoint = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT", "http://otel-collector.monitoring:4317")
        node_name = os.environ["NODE_NAME"]

        provider = TracerProvider()
        provider.add_span_processor(
            BatchSpanProcessor(OTLPSpanExporter(endpoint=endpoint, insecure=True))
        )
        trace.set_tracer_provider(provider)
        tracer = trace.get_tracer("node-lifecycle-tracer", "1.0.0")

        k8sconfig.load_incluster_config()
        v1 = k8s.CoreV1Api()
        deadline = time.time() + TIMEOUT

        log.info(f"Tracing lifecycle for node {node_name}")

        try:
            launch_time = imds_launch_time()
            log.info(f"EC2 launch (pendingTime): {launch_time}")
        except Exception as e:
            log.warning(f"IMDS unavailable: {e}")
            launch_time = None

        node_created, ready_time = wait_node_ready(v1, node_name, deadline)
        if launch_time is None:
            launch_time = node_created

        node = v1.read_node(node_name)
        instance_type = node.metadata.labels.get("node.kubernetes.io/instance-type", "unknown")
        workload = node.metadata.labels.get("workload", "inference")

        gpu_runtime_ready, gpu_runtime = wait_gpu_runtime_ready(v1, node_name, deadline)

        extra_attrs = {}
        if workload == "inference-nvlink":
            app = "kimi-k3"
            app_scheduled, pull_start, pull_complete, app_started, app_pod, role, first_pod_uid = wait_kimi_pod_on_node(v1, node_name, deadline)
            app_ready = wait_kimi_ready(v1, app_pod, role, deadline)
            extra_attrs["kimi.role"] = role
        else:
            app = "vllm"
            app_scheduled, pull_start, pull_complete, app_started, app_pod, first_pod_uid = wait_vllm_on_node(v1, node_name, deadline)
            app_ready = wait_vllm_health(v1, app_pod, deadline)

        spans = [
            ("node-launch-to-k8s-registered",          launch_time,    node_created,    {"phase": "infrastructure", "description": "userdata, kubelet start"}),
            ("k8s-registered-to-node-ready",           node_created,   ready_time,      {"phase": "kubelet",        "description": "CNI, kube-proxy, node conditions"}),
            (f"node-ready-to-{gpu_runtime}-initialized",       ready_time,        gpu_runtime_ready, {"phase": "gpu-operator", "description": "NVIDIA driver install, " + ("DRA kubelet plugin" if gpu_runtime == "dra" else "device plugin")}),
            (f"{gpu_runtime}-initialized-to-{app}-scheduled",  gpu_runtime_ready, app_scheduled,     {"phase": "scheduler",    "description": ("DRA ResourceClaim binding, pod placement" if gpu_runtime == "dra" else "device-plugin resource allocation, pod placement")}),
            (f"{app}-scheduled-to-image-pull-start",   app_scheduled,  pull_start,      {"phase": "runtime",        "description": "kubelet queues the image pull after scheduling"}),
            (f"{app}-image-pull",                      pull_start,     pull_complete,   {"phase": "runtime",        "description": "image pull time"}),
            (f"{app}-image-pull-to-container-start",   pull_complete,  app_started,     {"phase": "runtime",        "description": "container creation after image pull"}),
            (f"{app}-container-start-to-model-ready",  app_started,    app_ready,       {"phase": "model-load",     "description": "weight download + GPU load, or NCCL/rendezvous wait for a Kimi K3 worker"}),
        ]

        emit(tracer, {
            "node.name": node_name,
            "node.instance_type": instance_type,
            "workload": workload,
            "app": app,
            "gpu.runtime": gpu_runtime,
            **extra_attrs,
        }, spans)
        provider.force_flush(timeout_millis=10_000)
        log.info("Trace emitted successfully.")

        # log summary
        total = (app_ready - launch_time).total_seconds()
        log.info(f"Total cold-start: {total:.0f}s ({total/60:.1f}min)")

        # Keep watching this node for new app pods (a rollout replacing the
        # pod) or container restarts, emitting a fresh trace for each one.
        # Seed `seen` with the pod the trace above already covered so it
        # isn't immediately re-emitted as a "new" start.
        seen = {first_pod_uid: str(app_started)}
        log.info("Watching for further vLLM/Kimi pod rollouts and restarts on this node...")
        if workload == "inference-nvlink":
            watch_kimi_lifecycle(tracer, v1, node_name, seen)
        else:
            watch_vllm_lifecycle(tracer, v1, node_name, seen)


    if __name__ == "__main__":
        main()
