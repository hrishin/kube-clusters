apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-dcgm-metrics
data:
  # Superset of the operator's baked-in dcp-metrics-included.csv (verified live
  # against Mimir) plus the fault-detection fields it omits: XID errors, ECC
  # SBE/DBE, and thermal/power violation. Those are the fields an SLO actually
  # needs to page on — utilization/clocks/memory alone can't tell you the GPU
  # is throwing hardware faults.
  dcgm-metrics.csv: |
    # Clocks
    DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
    DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).

    # Temperature
    DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).
    DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).

    # Power
    DCGM_FI_DEV_POWER_USAGE,              gauge,   Power draw (in W).
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).

    # PCIe
    DCGM_FI_PROF_PCIE_TX_BYTES,      counter, Total bytes transmitted through PCIe TX via NVML.
    DCGM_FI_PROF_PCIE_RX_BYTES,      counter, Total bytes received through PCIe RX via NVML.
    DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.

    # NVLink — only populated on the gpu-nvlink node group's H100 SXM nodes;
    # a MIG-sliced single-GPU node has no NVLink fabric to report on.
    DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, Total NVLink bandwidth counters for all lanes.

    # Utilization
    DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
    DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).
    DCGM_FI_DEV_DEC_UTIL,      gauge, Decoder utilization (in %).

    # DCP profiling metrics — GR_ENGINE_ACTIVE is the real occupancy signal,
    # not DCGM_FI_DEV_GPU_UTIL (which only reports "was any kernel running").
    DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
    DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface is active.

    # Memory usage
    DCGM_FI_DEV_FB_FREE,     gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_USED,     gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (in MiB).

    # Errors and violations — MISSING from the operator's default set.
    # Alert on any of these being non-zero; see the Operations SLO section.
    #
    # DCGM_FI_DEV_XID_ERRORS is a gauge holding the LAST XID seen — verified
    # live against the running exporter: when no XID has fired, this series
    # doesn't exist at all (not 0), so `> 0` alerting has nothing to compare
    # against. DCGM_EXP_XID_ERRORS_COUNT is dcgm-exporter's own derived
    # counter for exactly this gap (commented out in its default-counters.csv):
    # it only creates a series once an XID actually fires, so alert on
    # increase(DCGM_EXP_XID_ERRORS_COUNT[5m]) > 0 instead.
    DCGM_FI_DEV_XID_ERRORS,         gauge,   Value of the last XID error encountered.
    DCGM_EXP_XID_ERRORS_COUNT,      counter, Number of XID errors reported during the last window.
    DCGM_FI_DEV_ECC_SBE_VOL_TOTAL,  counter, Total number of single-bit (correctable) volatile ECC errors.
    DCGM_FI_DEV_ECC_DBE_VOL_TOTAL,  counter, Total number of double-bit (uncorrectable) volatile ECC errors.
    DCGM_FI_DEV_THERMAL_VIOLATION,  counter, Number of microseconds spent thermal-throttled.
    DCGM_FI_DEV_POWER_VIOLATION,    counter, Number of microseconds spent power-throttled.

    # Retired / remapped memory rows
    DCGM_FI_DEV_ROW_REMAP_FAILURE,           gauge,   Whether remapping of rows has failed.
    DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of rows remapped due to uncorrectable errors.
    DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,   counter, Number of rows remapped due to correctable errors.

    # Licensing
    DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status.
