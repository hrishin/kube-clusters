apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver-gpu
  namespace: gpu-operator
spec:
  releaseName: nvidia-dra-driver-gpu
  chart:
    spec:
      chart: nvidia-dra-driver-gpu
      version: "25.12.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
  interval: 2m
  # DRA driver needs the NVIDIA driver + Container Toolkit (CDI) from the
  # GPU Operator to be ready before it can discover and expose GPUs.
  dependsOn:
    - name: nvidia-gpu-operator
      namespace: gpu-operator
  values:
    # Required when devicePlugin is disabled — confirms no collision with the
    # standard GPU device plugin (guarded by chart validation until KEP-5004 GA).
    gpuResourcesEnabledOverride: true

    # GPU Operator installs the driver at /run/nvidia/driver (driverInstallDir default).
    # The DRA driver reads device information from the same path via CDI.
    nvidiaDriverRoot: /run/nvidia/driver

    # Controller is a Deployment — run it on core nodes alongside the operator.
    # affinity overrides the chart's default requiredAffinity for control-plane
    # nodes, which don't exist in EKS (managed control plane).
    controller:
      nodeSelector:
        node-type: core
      tolerations:
        - key: node-type
          operator: Equal
          value: core
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - core

    # kubeletPlugin is a DaemonSet that must run on every GPU node to register
    # the DRA driver with the kubelet and publish ResourceSlices.
    kubeletPlugin:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: inference
          effect: NoSchedule
