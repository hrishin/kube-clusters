apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: gpu-operator
spec:
  releaseName: nvidia-gpu-operator
  chart:
    spec:
      chart: gpu-operator
      version: "v26.3.3"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
  interval: 2m
  # Default 5m timeout isn't enough for the driver DaemonSet — pulling the
  # driver image and compiling kernel modules on a fresh node routinely
  # takes longer, which was hitting "context deadline exceeded" here.
  # install.remediation.retries defaults to 0 (no retry), so that alone
  # was enough to push the release straight to a terminal Stalled state.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operator:
      defaultRuntime: containerd
      # Run the operator controller on core nodes
      nodeSelector:
        node-type: core
      tolerations:
        - key: node-type
          operator: Equal
          value: core
          effect: NoSchedule
    driver:
      enabled: true
      kernelModuleType: auto
      # Tells driver-manager which node label identifies DRA-consumer pods
      # so it can evict them before reloading the kernel module (e.g. on a
      # driver version upgrade). Without this it only knows how to evict
      # classic device-plugin pods, not DRA ResourceClaim consumers — same
      # class of gap that made mig-manager blind to the qwen pod earlier
      # (had to scale it down manually before MIG reconfiguration).
      manager:
        env:
          - name: NODE_LABEL_FOR_GPU_POD_EVICTION
            value: nvidia.com/dra-kubelet-plugin

    toolkit:
      enabled: true

    nfd:
      enabled: true

    dcgmExporter:
      # Attributes GPU metrics to the consuming pod/namespace/container.
      # NOTE: relies on the kubelet podresources API, which classic
      # device-plugin allocations populate — unverified whether DRA
      # ResourceClaim allocations do too. Being tested live.
      enablePodLabels: true
      serviceMonitor:
        enabled: true
      # Operator's baked-in dcp-metrics-included.csv omits XID/ECC/thermal
      # and power violation fields — the ones an SLO actually pages on.
      # dcgm-metrics-config.yaml is a superset that adds them back.
      config:
        name: custom-dcgm-metrics

    # Custom mig-parted config (mig-parted-config.yaml) so a node can be
    # partitioned as one 4g.40gb + one 3g.40gb instead of only the
    # single-profile "all-<profile>" options the chart ships by default.
    migManager:
      config:
        name: custom-mig-parted-config

    # Device plugin disabled — GPU exposure is handled by the DRA driver instead
    devicePlugin:
      enabled: false

    # Tolerations applied to ALL GPU Operator DaemonSets (driver, toolkit,
    # dcgm-exporter, gpu-feature-discovery).
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: inference
          effect: NoSchedule

    # NFD is included as a sub-chart. gc and master are Deployments that must
    # run on the core node. worker is a DaemonSet that must reach every node
    # (including mimir/logging/gpu) to discover hardware features.
    node-feature-discovery:
      gc:
        nodeSelector:
          node-type: core
        tolerations:
          - key: node-type
            operator: Equal
            value: core
            effect: NoSchedule
      master:
        nodeSelector:
          node-type: core
        tolerations:
          - key: node-type
            operator: Equal
            value: core
            effect: NoSchedule
      worker:
        tolerations:
          - key: node-type
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: workload
            operator: Exists
            effect: NoSchedule
