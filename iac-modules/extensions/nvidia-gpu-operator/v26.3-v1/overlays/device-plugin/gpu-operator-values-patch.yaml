apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: gpu-operator
spec:
  values:
    # Classic device plugin owns GPU allocation for this flavor — no DRA
    # driver release, no DRA-specific eviction wiring. driver-manager
    # already knows how to evict device-plugin pods before a driver
    # reload without any extra configuration.
    devicePlugin:
      enabled: true
    # mixed exposes each MIG profile as its own resource
    # (nvidia.com/mig-4g.40gb, nvidia.com/mig-3g.40gb) — required for this
    # node's heterogeneous layout. "single" only works when every instance
    # on the node shares one profile.
    mig:
      strategy: mixed
