apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen2-5-7b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen2-5-7b
  template:
    metadata:
      labels:
        app: vllm-qwen2-5-7b
    spec:
      nodeSelector:
        node-type: gpu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: workload
        operator: Equal
        value: inference
        effect: NoSchedule
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: vllm-gpu
      # Model weights are large (~4 GB AWQ); mount a cache so restarts skip re-download.
      # Replace with a PVC backed by EFS/EBS for persistence across pod restarts.
      volumes:
      - name: hf-cache
        emptyDir: {}
      containers:
      - name: qwen
        image: vllm/vllm-openai:v0.9.1
        imagePullPolicy: Always
        command: ["vllm", "serve"]
        args:
        - "Qwen/Qwen2.5-7B-Instruct-AWQ"
        - "--quantization=awq"
        - "--dtype=half"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
        - "--port=8000"
        - "--served-model-name=qwen2.5-7b"
        # open-webui sends tool_choice=auto by default; without these, vLLM
        # rejects every chat request with "'auto' tool choice requires
        # --enable-auto-tool-choice and --tool-call-parser to be set".
        # hermes matches Qwen2.5's built-in tool-use chat template.
        - "--enable-auto-tool-choice"
        - "--tool-call-parser=hermes"
        - "--otlp-traces-endpoint=http://otel-collector.monitoring.svc.cluster.local:4317"
        - "--collect-detailed-traces=all"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: HF_HOME
          value: /data/huggingface
        - name: OTEL_SERVICE_NAME
          value: vllm
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://otel-collector.monitoring.svc.cluster.local:4317
        resources:
          requests:
            cpu: "2"
            memory: "12Gi"
          limits:
            cpu: "4"
            memory: "14Gi"
          claims:
          - name: gpu
        volumeMounts:
        - name: hf-cache
          mountPath: /data/huggingface
        # vLLM takes 5-15 min on first start to download and load the model
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
