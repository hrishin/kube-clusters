apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scaleway-ccm
  namespace: kube-system
spec:
  releaseName: scaleway-ccm
  chart:
    spec:
      chart: scaleway-cloud-controller-manager
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: scaleway
        namespace: kube-system
  interval: 30m
  values:
    # The CCM manages:
    #   - Node lifecycle (tainting nodes with cloud conditions)
    #   - Scaleway Load Balancers for Services of type LoadBalancer
    #
    # Credentials are mounted from the Secret created by Pulumi.
    # The Secret name must match scalewaySecret.name below.
    scalewaySecret:
      # This Secret is created by the CAPS controller in the default namespace.
      # The CCM needs the same credentials as CAPS.
      # Create a copy in kube-system if needed, or adjust the namespace below.
      name: scaleway-cloud-config
      namespace: kube-system
    args:
      - --cloud-provider=scaleway
      - --leader-elect=true
    tolerations:
      - key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
