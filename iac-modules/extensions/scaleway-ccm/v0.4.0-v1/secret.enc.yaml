# Scaleway credentials Secret for the CCM.
# The CCM expects a Secret in kube-system with these keys.
# Values are populated from the SOPS-encrypted config at apply time via Flux
# postBuild variable substitution or an ExternalSecret.
#
# For a quick start you can create this Secret manually:
#   kubectl create secret generic scaleway-cloud-config \
#     --namespace kube-system \
#     --from-literal=SCW_ACCESS_KEY=<your-access-key> \
#     --from-literal=SCW_SECRET_KEY=<your-secret-key> \
#     --from-literal=SCW_DEFAULT_PROJECT_ID=<your-project-id> \
#     --from-literal=SCW_DEFAULT_REGION=<region> \
#     --from-literal=SCW_DEFAULT_ZONE=<zone>
#
# This file is intentionally not applied by Flux (it is excluded from the
# kustomization.yaml resources list).  Create or manage the Secret out-of-band
# or via an ExternalSecret / SOPS-encrypted Secret.
apiVersion: v1
kind: Secret
metadata:
    name: scaleway-cloud-config
    namespace: kube-system
type: Opaque
stringData:
    SCW_ACCESS_KEY: ""
    SCW_SECRET_KEY: ""
    SCW_DEFAULT_PROJECT_ID: ""
    SCW_DEFAULT_REGION: ""
    SCW_DEFAULT_ZONE: ""
