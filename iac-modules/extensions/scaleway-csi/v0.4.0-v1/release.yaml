apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scaleway-csi
  namespace: kube-system
spec:
  releaseName: scaleway-csi
  chart:
    spec:
      chart: scaleway-csi-node
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: scaleway
        namespace: kube-system
  interval: 30m
  values:
    # The CSI driver provisions Scaleway Block Storage for PersistentVolumeClaims.
    # It reads credentials from the same Secret used by the CCM.
    secret:
      name: scaleway-cloud-config
      namespace: kube-system
    storageClass:
      # Create a default StorageClass backed by Scaleway Block Storage (SSD tier)
      defaultStorageClass: true
      reclaimPolicy: Delete
    tolerations:
      - operator: Exists
