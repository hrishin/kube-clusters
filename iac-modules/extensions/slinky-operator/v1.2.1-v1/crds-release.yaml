apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slurm-operator-crds
  namespace: slinky
spec:
  releaseName: slurm-operator-crds
  chart:
    spec:
      chart: slurm-operator-crds
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: slinky
  interval: 1m
  # Shipped as its own chart (unlike e.g. kube-prometheus-stack, which bundles
  # CRDs into the main chart and needs install/upgrade.crds: Skip + a separate
  # raw-manifest Flux Kustomization) specifically so `helm upgrade` on it is
  # safe — no special-casing needed here.
