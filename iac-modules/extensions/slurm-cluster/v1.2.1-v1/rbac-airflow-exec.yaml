apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-slurm-exec
  namespace: slurm
rules:
  # action_linux_llm_finetune DAG (iac-modules/extensions/airflow) submits
  # and polls sbatch jobs via `kubectl exec` into slurm-controller-0 — no
  # LoginSet/REST-API JWT flow deployed for this cluster yet.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # "get", not "create": the python kubernetes client's
  # connect_get_namespaced_pod_exec (used by the DAG) issues an HTTP GET to
  # establish the exec connection, which Kubernetes RBAC authorizes under
  # the "get" verb — confirmed live via a 403 explicitly naming "get" as the
  # denied verb. `kubectl exec` itself uses a different code path that maps
  # to "create", which is why most RBAC examples online show only that —
  # granting both covers either client.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-slurm-exec
  namespace: slurm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-slurm-exec
subjects:
  - kind: ServiceAccount
    name: airflow-slurm-exec
    namespace: airflow
