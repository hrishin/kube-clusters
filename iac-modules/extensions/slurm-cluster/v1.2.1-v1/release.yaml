apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slurm
  namespace: slurm
spec:
  releaseName: slurm
  chart:
    spec:
      chart: slurm
      version: "1.2.1"
      sourceRef:
        kind: HelmRepository
        name: slurm
  interval: 2m
  # slurm-operator (namespace slinky) must be Ready before its CRDs'
  # controller exists to reconcile this SlurmCluster.
  dependsOn:
    - name: slurm-operator
      namespace: slinky
  values:
    controller:
      persistence:
        # Only StorageClass this cluster has (see local-path-provisioner
        # under core-infra). Single-node, not HA — same caveat as
        # grafana/prometheus's local-path use elsewhere in this repo.
        storageClassName: local-path
      podSpec:
        nodeSelector:
          node-type: core
        tolerations:
          - key: node-type
            operator: Equal
            value: core
            effect: NoSchedule

    accounting:
      # No MariaDB/mariadb-operator deployed yet. Flip on once accounting is
      # actually needed — see docs/installation.md in the slurm-operator repo.
      enabled: false

    # Pyxis SPANK plugin stack, for `srun --container-image=... python train.py`
    # (Enroot-backed container submission). Neither Pyxis nor Enroot ship in
    # the upstream slurmd image — the gpu NodeSet below runs a custom image
    # (see slurmd-pyxis-enroot.Dockerfile in this directory) with both built
    # in at /usr, matching this default path.
    configFiles:
      plugstack.conf: |
        include /usr/share/pyxis/*

    partitions:
      all:
        enabled: true
        nodesets:
          - ALL
        configMap:
          Default: "YES"
          MaxTime: UNLIMITED

    nodesets:
      # Single-node GPU compute, targeting the same `gpu-inference` node pool
      # (config.yaml) that vLLM/qwen/kimi inference already schedules onto.
      # Left disabled + zero-replica: enabling this without carving out
      # dedicated capacity (or at least a shared priority/preemption policy)
      # would have Slurm batch jobs competing with live inference serving for
      # the same preemptible GPU nodes. Enabled at replicas: 1 for an
      # end-to-end smoke test (sinfo/sbatch/squeue against a real node) —
      # revisit before leaving this on, since gpu-inference is preemptible
      # and shared with live vLLM/Kimi/Qwen serving.
      gpu:
        enabled: true
        replicas: 1
        podSpec:
          nodeSelector:
            node-type: gpu
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
            - key: workload
              operator: Equal
              value: inference
              effect: NoSchedule
        slurmd:
          # gpu-inference nodes are MIG-partitioned (config.yaml
          # nvidia.com/mig.config: 4g40gb-plus-3g40gb) and advertise
          # nvidia.com/mig-4g.40gb / nvidia.com/mig-3g.40gb, not
          # nvidia.com/gpu (allocatable 0 there) — confirmed live via
          # `kubectl describe node`, after nvidia.com/gpu: 1 sat Pending
          # forever with "Insufficient nvidia.com/gpu". The 4g.40gb slice is
          # already used by qwen inference; 3g.40gb is the one config.yaml
          # calls out as free for a second workload.
          resources:
            limits:
              nvidia.com/mig-3g.40gb: 1
          extraConfMap:
            gres.conf: |
              AutoDetect=nvml
          # Custom image = ghcr.io/slinkyproject/slurmd:26.05-ubuntu26.04
          # (nodesetDefaults.slurmd.image) + Enroot v4.2.1 + Pyxis v0.24.0
          # baked in, built and verified locally against slurm 26.05.3 (the
          # exact version this base image reports via `slurmd -V`). Source:
          # slurmd-pyxis-enroot.Dockerfile in this directory. Built and
          # pushed to GHCR by
          # .github/workflows/docker-publish-slurmd-pyxis-enroot.yml on
          # every change to that Dockerfile, using the workflow's own
          # GITHUB_TOKEN — no extra secrets needed. The package is private
          # by default on first publish; if slurmd's ImagePullSecrets isn't
          # set up for it, either make the package public (repo → Packages →
          # slurmd-pyxis-enroot → Package settings) or add a pull secret.
          image:
            repository: ghcr.io/hrishin/slurmd-pyxis-enroot
            tag: 26.05-ubuntu26.04-pyxis0.24.0-enroot4.2.1
          # Enroot needs to create nested user/mount namespaces + overlayfs
          # mounts from inside an already-containerized slurmd pod.
          # privileged:true is the "definitely works" option; NOT verified
          # whether the unprivileged path (CAP_SYS_ADMIN + /dev/fuse) is
          # sufficient on this cluster's actual kernel/PSA config. This also
          # means gpu-inference now runs a privileged container alongside
          # live vLLM/Qwen/Kimi inference on the same shared preemptible
          # pool (see the nodesets comment above) — confirm that's
          # acceptable before this merges, independent of image correctness.
          securityContext:
            privileged: true
          env:
            - name: ENROOT_RUNTIME_PATH
              value: /run/enroot

      # ---------------------------------------------------------------------
      # RoCE / InfiniBand / RDMA placeholder — NOT wired up, do not enable
      # as-is.
      #
      # Targets the multi-node H100 SXM pool (config.yaml `gpu-nvlink`, and
      # the `gpu_clusters.h100-cluster` InfiniBand fabric it attaches to —
      # both currently commented out in
      # iac-modules/cluster-infra/nebius-mk8s-v1.34-v1's config, same as the
      # kimi LeaderWorkerSet that also targets this pool). Three things need
      # to be true before this is real, none of which exist yet:
      #
      #   1. The `gpu-nvlink` node group + `gpu_clusters.h100-cluster` are
      #      actually provisioned (Pulumi config.yaml).
      #   2. An RDMA device plugin is deployed and exposing a Kubernetes
      #      extended resource — e.g. the NVIDIA Network Operator, or
      #      Mellanox/NVIDIA's k8s-rdma-shared-dev-plugin. The `rdma/hca`
      #      resource name below is a placeholder guess (that plugin's
      #      default shared-pool name), not verified against anything
      #      actually deployed on this cluster.
      #   3. A topology.yaml matching Nebius's real IB switch layout is
      #      written (https://slurm.schedmd.com/topology.yaml.html), and each
      #      Kubernetes node carries the
      #      `topology.slinky.slurm.net/spec: topo-switch:<id>,topo-block:<id>`
      #      annotation the operator reads to populate it — see
      #      https://github.com/SlinkyProject/slurm-operator/blob/main/docs/usage/topology.md
      #
      # gpu-nvlink:
      #   enabled: false
      #   replicas: 0
      #   podSpec:
      #     nodeSelector:
      #       node-type: gpu-nvlink
      #     tolerations:
      #       - key: nvidia.com/gpu
      #         operator: Exists
      #         effect: NoSchedule
      #       - key: workload
      #         operator: Equal
      #         value: inference-nvlink
      #         effect: NoSchedule
      #   slurmd:
      #     resources:
      #       limits:
      #         nvidia.com/gpu: 8
      #         rdma/hca: 1   # placeholder — see caveat (2) above
      #     extraConfMap:
      #       gres.conf: |
      #         AutoDetect=nvml
      #       topology.yaml: |
      #         # Placeholder shape only — not derived from Nebius's actual
      #         # IB switch layout. Replace before uncommenting.
      #         Topologies:
      #           - Name: nvlink-fabric
      #             Switches:
      #               - Name: s1
      #                 Nodes: ALL
