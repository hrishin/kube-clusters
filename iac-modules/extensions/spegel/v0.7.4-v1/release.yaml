apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: spegel
spec:
  releaseName: spegel
  chart:
    spec:
      chart: spegel
      version: "0.7.4"
      sourceRef:
        kind: HelmRepository
        name: spegel
  interval: 1m
  # The chart's `hostPort: 30020` mechanism for the registry endpoint (the
  # only part of Spegel that needs to be reachable from containerd, which
  # runs in the *host's* network namespace, not a pod's) turned out to never
  # actually be programmed by Cilium on this cluster — confirmed on every
  # node, including pods with zero restarts: nothing ever listens on 30020
  # on the host, despite the container's own port 5000 answering fine
  # internally. spegel_mirror_requests_total stayed at zero the entire
  # session as a result — every pull silently fell through to origin.
  # The chart has no values knob for hostNetwork, so it's patched in via
  # postRenderers. service.registry.port is bumped to 30020 (rather than
  # leaving it at 5000 and changing hostPort) so the peer-advertisement URL
  # (which uses hostPort) still matches where Spegel actually binds once
  # hostNetwork makes the hostPort field itself a no-op — and so our
  # existing cloud-init hosts.toml (already pointed at :30020) needs no
  # change on any node.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: spegel
            patch: |
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
  values:
    # See postRenderers above for why this changed from the chart default (5000).
    service:
      registry:
        port: 30020
    spegel:
      containerdMirrorAdd: false
      # Upstream default (20ms, x3 retries = ~60ms total budget) is too tight
      # for a DHT-based peer lookup, especially the first time a given digest
      # is resolved. 5s x5 retries (~25s worst-case budget) not yet
      # justified against spegel_mirror_requests_total hit/miss data on this
      # cluster — genuine cache-misses (image on no peer) now wait up to 25s
      # before falling back to origin, so revisit if that metric shows
      # misses aren't actually timeout-related.
      mirrorResolveTimeout: "5s"
      mirrorResolveRetries: 5
      # DEBUG surfaces more router/libp2p-level detail, but Spegel's own code
      # has no per-request success log line even at this level (registry.go
      # only logs on failure) — the actual "is P2P serving this pull" signal
      # is the spegel_mirror_requests_total{cache="hit"|"miss"} metric, not
      # logs. See https://spegel.dev metrics docs if that's what you need.
      logLevel: "DEBUG"
