apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spegel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spegel
      app.kubernetes.io/instance: spegel
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
