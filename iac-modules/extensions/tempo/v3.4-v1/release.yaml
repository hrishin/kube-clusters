apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  interval: 2m
  values:
    tolerations:
      - key: node-type
        operator: Equal
        value: mimir
        effect: NoSchedule
    nodeSelector:
      node-type: mimir

    tempo:
      retention: 48h
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    persistence:
      enabled: true
      size: 10Gi
      storageClassName: local-path
