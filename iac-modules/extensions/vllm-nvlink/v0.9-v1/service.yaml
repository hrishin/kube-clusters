---
# Headless service — StatefulSet pod DNS: vllm-nvlink-{N}.vllm-nvlink-headless.<ns>.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: vllm-nvlink-headless
spec:
  clusterIP: None
  selector:
    app: vllm-nvlink
  ports:
  - name: ray-gcs
    port: 6379
    targetPort: 6379
  - name: ray-dashboard
    port: 8265
    targetPort: 8265
---
# ClusterIP service — exposes the inference endpoint served by pod 0 (head).
apiVersion: v1
kind: Service
metadata:
  name: vllm-nvlink
spec:
  selector:
    app: vllm-nvlink
    # Route only to head pod (pod-0) which runs vLLM serve.
    statefulset.kubernetes.io/pod-name: vllm-nvlink-0
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
